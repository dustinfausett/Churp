name: Google Play connection test
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-play-connection-test
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check repository variables
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "$PROVIDER" || -z "$SERVICE_ACCOUNT" ]]; then
            echo "::error::Set GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT in repository Actions variables."
            exit 1
          fi
      - name: Authenticate to Google
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: model-craft-515004-s6
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify Play access and discard temporary edit
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          
          const token = process.env.PLAY_ACCESS_TOKEN;
          if (!token) throw new Error('Google authentication did not return an access token.');
          const base = 'https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.churptree.app/edits';
          async function request(url, method, body) {
            const response = await fetch(url, {
              method,
              headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: body === undefined ? undefined : JSON.stringify(body),
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) {
              const hints = {
                401: 'Check the Google access token and Android Publisher scope.',
                403: 'Check that the Android Publisher API is enabled and the service account has Churp app access in Play Console.',
                404: 'Check that com.churptree.app exists in Play Console. A new app may need its first bundle uploaded manually.',
              };
              throw new Error('Play API ' + method + ' failed (HTTP ' + response.status + '). ' + (hints[response.status] || 'Check Google API availability and retry.'));
            }
            return response.status === 204 ? null : response.json();
          }
          try {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Google service-account authentication succeeded.\n\n');
            const edit = await request(base, 'POST', {});
            if (!edit?.id) throw new Error('Play API returned no edit ID.');
            const editUrl = base + '/' + encodeURIComponent(edit.id);
            try {
              await request(editUrl + '/tracks', 'GET');
            } finally {
              await request(editUrl, 'DELETE');
            }
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Play Console access verified for com.churptree.app. Temporary edit discarded. No app was uploaded or published.\n');
            console.log('Google authentication and Play Console access verified.');
          } catch (error) {
            console.error(error.message);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Play Console check failed: ' + error.message + '\n');
            process.exitCode = 1;
          }
          NODE
