name: App checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.encryption.config.js documents.spec.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: app-test-results
          path: test-results-encryption/
